<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>avensio e2e — test runs</title>
<script>
(function(){var t=localStorage.getItem('theme');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  --bg:#0b0d12;--surface:#13161d;--surface-2:#191d26;--surface-3:#222734;
  --border:#262b36;--border-soft:#1c2029;--text:#e7e9ee;--muted:#868c99;--dim:#5a6070;
  --accent:#7dd3fc;--accent-2:#a78bfa;--ok:#4ade80;--fail:#f87171;--warn:#fbbf24;--run:#22d3ee;
  --topbar-bg:linear-gradient(180deg,#0b0d12 0%,rgba(11,13,18,.85) 100%);
  --sidebar-bg:linear-gradient(180deg,#0b0d12,#0d1017);
  --mono:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,"Inter","Segoe UI",Roboto,sans-serif;
}
html[data-theme="light"]{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f1f2f5;--surface-3:#e7e9ee;
  --border:#d8dbe2;--border-soft:#e7e9ee;--text:#12151c;--muted:#5b6374;--dim:#98a0ae;
  --accent:#0ea5b7;--accent-2:#7c3aed;--ok:#16a34a;--fail:#dc2626;--warn:#d97706;--run:#0891b2;
  --topbar-bg:linear-gradient(180deg,#fff 0%,rgba(255,255,255,.85) 100%);
  --sidebar-bg:linear-gradient(180deg,#fafbfc,#f3f4f7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;transition:background .2s,color .2s}
body{min-height:100vh;display:flex;flex-direction:column}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:13px 22px;background:var(--topbar-bg);border-bottom:1px solid var(--border-soft);backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600}
.logo-mark{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 180deg at 50% 50%,#7dd3fc,#a78bfa,#4ade80,#7dd3fc);position:relative}
.logo-mark::after{content:"";position:absolute;inset:4px;background:var(--bg);border-radius:5px}
.logo-mark::before{content:"";position:absolute;inset:10px;background:var(--text);border-radius:2px;box-shadow:0 0 12px var(--accent)}
.logo-sub{color:var(--muted);font-size:12px;font-family:var(--mono)}
.spacer{flex:1}
.btn{color:var(--muted);padding:6px 10px;border-radius:6px;border:1px solid var(--border);font-family:var(--mono);font-size:12px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{color:var(--text);border-color:var(--accent)}
.main{display:grid;grid-template-columns:340px 1fr;flex:1;min-height:0}
.sidebar{border-right:1px solid var(--border-soft);overflow-y:auto;background:var(--sidebar-bg)}
.sidebar-head{padding:14px 16px 8px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.run-list{padding:4px 8px 24px;display:flex;flex-direction:column;gap:4px}
.run-card{padding:11px 13px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:.12s}
.run-card:hover{background:var(--surface);border-color:var(--border-soft)}
.run-card.sel{background:var(--surface-2);border-color:var(--border)}
.run-title{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.run-meta{color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:3px}
.badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.badge.passed{color:var(--ok);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
.badge.failed{color:var(--fail);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08)}
.badge.testing,.badge.running{color:var(--run);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)}
.content{overflow-y:auto;padding:20px 24px 60px}
.run-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.run-head h1{font-size:18px;margin:0}
.run-sub{color:var(--muted);font-family:var(--mono);font-size:12px;margin-bottom:16px}
.artifacts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:7px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.chip:hover{color:var(--text);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.shot{position:relative;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--border-soft);cursor:zoom-in;transition:.12s}
.shot:hover{border-color:var(--accent);transform:translateY(-2px)}
.shot img{width:100%;height:165px;object-fit:cover;object-position:top;display:block;background:#000}
.shot .cap{position:absolute;left:0;right:0;bottom:0;padding:7px 10px;font-size:11px;font-family:var(--mono);color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.82),transparent);display:flex;align-items:center;gap:6px}
.cap .step{color:var(--accent);font-weight:700}
.empty{color:var(--dim);padding:60px;text-align:center}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(6,8,12,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:82vh;border-radius:8px;border:1px solid #2a2f3a}
.lb-cap{font-family:var(--mono);font-size:13px;color:#e7e9ee}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);font-size:42px;color:#fff;opacity:.55;padding:0 22px;user-select:none}
.lb-nav:hover{opacity:1}.lb-prev{left:6px}.lb-next{right:6px}
.lb-close{position:fixed;top:16px;right:22px;font-size:26px;color:#fff;opacity:.7}.lb-close:hover{opacity:1}
.sccount{font-family:var(--mono);font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><div class="logo-mark"></div><div><div>avensio e2e</div><div class="logo-sub" id="sub">test runs</div></div></div>
  <div class="spacer"></div>
  <span class="scount" id="globalcount"></span>
  <button class="btn" id="refresh">↻ refresh</button>
  <button class="btn" id="theme">◐ theme</button>
</div>
<div class="main">
  <div class="sidebar"><div class="sidebar-head">Runs</div><div class="run-list" id="runs"></div></div>
  <div class="content" id="content"><div class="empty">Loading…</div></div>
</div>
<div class="lightbox" id="lb">
  <button class="lb-close" id="lb-close">✕</button>
  <button class="lb-nav lb-prev" id="lb-prev">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-nav lb-next" id="lb-next">›</button>
  <div class="lb-cap" id="lb-cap"></div>
</div>
<script>
let RUNS=[], cur=null, shots=[], lbIdx=0;

function humanize(name){
  const base=name.replace(/\.[^.]+$/,'');
  const m=base.match(/^(\d+[a-z]?)[-_](.+)$/i);
  if(m) return {step:m[1], text:m[2].replace(/[-_]/g,' ')};
  return {step:'', text:base.replace(/[-_]/g,' ')};
}
function badge(state){ if(!state) return ''; const s=String(state).toLowerCase(); return `<span class="badge ${s}">${state}</span>`; }

async function load(){
  const data=await fetch('/api/runs').then(r=>r.json());
  RUNS=data.runs||[];
  document.getElementById('sub').textContent=data.root||'test runs';
  document.getElementById('globalcount').textContent=`${RUNS.length} runs · ${RUNS.reduce((a,r)=>a+r.shots.length,0)} screenshots`;
  const list=document.getElementById('runs');
  list.innerHTML=RUNS.map((r,i)=>`<div class="run-card" data-i="${i}">
    <div class="run-title">${r.label} ${badge(r.state)}</div>
    <div class="run-meta">${r.shots.length} shots${r.files.length?` · ${r.files.length} files`:''} · ${r.when||''}</div></div>`).join('')
    || '<div class="empty">no runs yet</div>';
  list.querySelectorAll('.run-card').forEach(el=>el.onclick=()=>select(+el.dataset.i));
  const want=location.hash.slice(1);
  let idx=RUNS.findIndex(r=>r.key===want); if(idx<0) idx=0;
  if(RUNS.length) select(idx);
}
function select(i){
  cur=RUNS[i]; if(!cur) return;
  location.hash=cur.key;
  document.querySelectorAll('.run-card').forEach((el,j)=>el.classList.toggle('sel',j===i));
  shots=cur.shots;
  const arts=cur.files.map(f=>`<a class="chip" href="/file/${encodeURI(f.path)}" target="_blank">📄 ${f.name}</a>`).join('');
  const grid=shots.map((s,si)=>{const h=humanize(s.name);return `<div class="shot" data-si="${si}">
      <img loading="lazy" src="/file/${encodeURI(s.path)}">
      <div class="cap">${h.step?`<span class="step">${h.step}</span>`:''}<span>${h.text}</span></div></div>`;}).join('');
  document.getElementById('content').innerHTML=`
    <div class="run-head"><h1>${cur.label}</h1>${badge(cur.state)}</div>
    <div class="run-sub">${cur.key} · ${shots.length} screenshots</div>
    ${arts?`<div class="artifacts">${arts}</div>`:''}
    ${shots.length?`<div class="grid">${grid}</div>`:'<div class="empty">no screenshots in this run</div>'}`;
  document.querySelectorAll('.shot').forEach(el=>el.onclick=()=>openLb(+el.dataset.si));
}
function openLb(i){lbIdx=i;showLb();document.getElementById('lb').classList.add('open');}
function showLb(){const s=shots[lbIdx];if(!s)return;const h=humanize(s.name);
  document.getElementById('lb-img').src='/file/'+encodeURI(s.path);
  document.getElementById('lb-cap').textContent=(h.step?h.step+' · ':'')+h.text+'   ('+(lbIdx+1)+'/'+shots.length+')';}
function nav(d){lbIdx=(lbIdx+d+shots.length)%shots.length;showLb();}
document.getElementById('lb-close').onclick=()=>document.getElementById('lb').classList.remove('open');
document.getElementById('lb-prev').onclick=()=>nav(-1);
document.getElementById('lb-next').onclick=()=>nav(1);
document.getElementById('lb').onclick=e=>{if(e.target.id==='lb')document.getElementById('lb').classList.remove('open');};
document.addEventListener('keydown',e=>{if(!document.getElementById('lb').classList.contains('open'))return;
  if(e.key==='Escape')document.getElementById('lb').classList.remove('open');if(e.key==='ArrowLeft')nav(-1);if(e.key==='ArrowRight')nav(1);});
document.getElementById('refresh').onclick=load;
document.getElementById('theme').onclick=()=>{const n=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);};
load(); setInterval(load, 20000);
</script>
</body></html>
